<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sonido Vivo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="encabezado">
        <div class="contenedor">

            <a href="index.html">
                <img src="img/logo.jpg" alt="Sonido Vivo - Tienda de Instrumentos Musicales" class="logo">
            </a>

            <nav class="menu">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="login.html">Iniciar Sesión</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main class="contenedor espaciador-superior">

        <div class="caja-formulario">
            <h2 class="titulo-centrado">Iniciar Sesión</h2>
            <form id="form-login" novalidate>

                <div class="campo">
                    <label for="login-email">Correo Electrónico *</label>
                    <input 
                        type="email" 
                        id="login-email" 
                        maxlength="100"
                        placeholder="ejemplo@correo.cl"
                        autocomplete="email"
                        required>
                    <small class="error-texto" id="error-login-email"></small>
                </div>

                <div class="campo">
                    <label for="login-pass">Contraseña *</label>
                    <input 
                        type="password" 
                        id="login-pass"
                        autocomplete="current-password"
                        required>
                    <small class="error-texto" id="error-login-pass"></small>
                </div>

                <button type="submit" class="boton">Ingresar</button>
                <div id="mensaje-login" class="mensaje-exito" role="alert" aria-live="polite"></div>
                <p style="text-align:center; margin-top:1rem;">
                    ¿No tienes cuenta?
                    <a href="registro.html">Regístrate aquí</a>
                </p>
            </form>
        </div>

    </main>

    <footer class="pie-pagina">
        <div class="contenedor">
            <p>&copy; 2026 Sonido Vivo. Viña del Mar, Chile.</p>
        </div>
    </footer>

    <script src="js/login.js"></script>

</body>

</html>
