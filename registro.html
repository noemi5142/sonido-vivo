<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Usuario - Sonido Vivo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="encabezado">
        <div class="contenedor">
            <a href="index.html">
                <img src="img/logo.jpg" alt="Sonido Vivo - Tienda de Instrumentos Musicales" class="logo">
            </a>
            <nav class="menu">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Catálogo</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contenedor espaciador-superior">
        <div class="caja-formulario">
            <h2 class="titulo-centrado">Crear Cuenta</h2>
            <form id="form-registro" novalidate>
                <div class="campo">
                    <label for="reg-run">RUN * (Sin puntos ni guion)</label>
                    <input type="text" id="reg-run" required placeholder="Ej: 19011022K" maxlength="10">
                    <small class="error-texto" id="error-reg-run"></small>
                </div>

                <div class="campo">
                    <label for="reg-nombre">Nombre *</label>
                    <input type="text" id="reg-nombre" required maxlength="50">
                    <small class="error-texto" id="error-reg-nombre"></small>
                </div>

                <div class="campo">
                    <label for="reg-apellidos">Apellidos *</label>
                    <input type="text" id="reg-apellidos" required maxlength="100">
                    <small class="error-texto" id="error-reg-apellidos"></small>
                </div>

                <div class="campo">
                    <label for="reg-email">Correo Electrónico *</label>
                    <input type="email" id="reg-email" required maxlength="100">
                    <small class="error-texto" id="error-reg-email"></small>
                </div>

                <div class="campo">
                    <label for="reg-region">Región *</label>
                    <select id="reg-region" required>
                        <option value="arica">Arica y Parinacota</option>
                        <option value="tarapaca">Tarapacá</option>
                        <option value="antofagasta">Antofagasta</option>
                        <option value="atacama">Atacama</option>
                        <option value="coquimbo">Coquimbo</option>
                        <option value="valparaiso">Valparaíso</option>
                        <option value="metropolitana">Metropolitana</option>
                        <option value="olibertador">O'Higgins</option>
                        <option value="maule">Maule</option>
                        <option value="nuble">Ñuble</option>
                        <option value="biobio">Biobío</option>
                        <option value="araucania">La Araucanía</option>
                        <option value="lagos">Los Lagos</option>
                        <option value="aysen">Aysén</option>
                        <option value="magallanes">Magallanes</option>
                    </select>
                    <small class="error-texto" id="error-reg-region"></small>
                </div>

                <div class="campo">
                    <label for="reg-comuna">Comuna *</label>
                    <select id="reg-comuna" required disabled>
                        <option value="">Primero selecciona región</option>
                    </select>
                    <small class="error-texto" id="error-reg-comuna"></small>
                </div>

                <div class="campo">
                    <label for="reg-direccion">Dirección *</label>
                    <input type="text" id="reg-direccion" required maxlength="300">
                    <small class="error-texto" id="error-reg-direccion"></small>
                </div>

                <button type="submit" class="boton">Registrarse</button>
                <p style="text-align:center; margin-top:1rem;">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
                </p> 
                
            </form>
        </div>
    </main>

    <footer class="pie-pagina">
        <div class="contenedor"><p>&copy; 2026 Sonido Vivo. Viña del Mar, Chile.</p></div>
    </footer>

    <script src="js/funciones.js"></script>
</body>
</html>
