<!DOCTYPE html> 
<html lang="es"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Sonido Vivo</title>

    <link rel="stylesheet" href="css/style.css"> 
</head>
<body>
    <header class="encabezado">
        <div class="contenedor">
            <h1 class="logo-text">
                <img src="img/logo.jpg" alt="Sonido Vivo" class="logo">
            </h1>
            <nav class="menu">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="contacto.html" class="activo">Contacto</a></li>
                </ul>
            </nav>
        </div>    
    </header>
    
     <main class="contenedor">
        <h2 class="titulo-centrado" style="margin-top: 2rem;">Contáctanos</h2>
        
        <form id="mi-formulario" class="caja-formulario" novalidate>
            <!-- Campo 1: Nombre -->
            <div class="campo">
                <label for="nombre">Nombre completo *</label>
                <input type="text" id="nombre">
                <small class="error-texto" id="error-nombre"></small>
            </div>

            <!-- Campo 2: Email -->
            <div class="campo">
                <label for="email">Correo electrónico *</label>
                <input type="email" id="email" >
                <small class="error-texto" id="error-email"></small>
            </div>

            <!-- Campo 3: Telefono (opcional)-->
            <div class="campo">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" placeholder="Ej; 9123345678">
                <small class="Error-texto" id="error-telefono"></small>
            </div>

            <!-- Campo 4: Motivo -->
            <div class="campo">
                <label for="motivo">Motivo de consulta *</label>
                <select id="motivo">
                    <option value="">Seleccionar una opción</option>
                    <option value="stock">Consulta Stock</option>
                    <option value="servicio">Servicio Técnico</option>
                    <option value="envios">Envíos</option>
                </select>
                <small class="error-texto" id="error-motivo"></small>
            </div>

            <!-- Campo 5: Mensaje -->
            <div class="campo">
                <label for="mensaje">Mensaje *</label>
                <textarea id="mensaje" rows="4"></textarea>
                <small class="error-texto" id="error-mensaje"></small>
            </div>

            <button type="submit" class="boton">Enviar consulta</button>

            <!-- Mensaje de confirmación -->
            <div id="mensaje-confirmacion" class="mensaje-exito">
                ¡Consulta enviada correctamente! Te contactaremos pronto.
            </div>
        </form>
    </main>

    <footer class="pie-pagina">
        <div class="contenedor"><p>&copy; 2026 Sonido Vivo.</p></div>
    </footer>
    <script src="js/funciones.js"></script>
</body>
</html>
